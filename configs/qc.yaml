# Unit QC, signed off 2026-09-28 (see docs/DECISIONS.md).
# Changing any value changes the preprocessed data: bump PREPROC_VERSION (R6), and
# never change it to improve a metric.

# IBL's QC label is the fraction of 3 metrics passed (sliding refractory period,
# noise cutoff, amplitude). 1.0 already implies the refractory-period check.
min_label: 1.0
# Units located outside the brain or with no region assigned.
exclude_regions: [void, root]
# Applied to the task-period rate: spikes from the first trial's start to the last
# trial's end, over that time (since PREPROC_VERSION 2, signed off 2026-09-28). The
# release's whole-recording firing_rate includes pre- and post-task time, where some
# units fire almost exclusively; it is kept as a reported column only.
min_firing_rate_hz: 0.1
