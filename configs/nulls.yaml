# The two null rows of the evaluation contract (CLAUDE.md §5), signed off by the user
# 2026-09-28. Never change a value to make a result beat its null (R6).

# null_shuffle: targets circularly shifted within a session, preserving their
# autocorrelation. Shifts are drawn uniformly (seeded) from [min, length - min].
null_shuffle:
  n_shifts: 20
  # Per-bin targets, within the task period: ~20x the slowest decorrelation measured
  # (movement state, ~1.3 s).
  min_shift_s: 30.0
  # Trial-level targets: longer than any block (<= 99 trials) and the 90-trial opening
  # block. Sessions with fewer than 2x this many usable trials get no shuffle null.
  min_shift_trials: 100

# null_trialstruct: prediction from task variables only, never spikes.
null_trialstruct:
  # Per-bin targets: one-hot time since trial start, stimulus onset and go cue, in
  # time_bin_s steps up to max_time_s (then one "later" feature).
  time_bin_s: 0.1
  max_time_s: 3.0
  # Trial-level targets: this many previous trials' stimulus side, choice and reward.
  history_trials: 10

# null_pseudosession (block only; adopted after the first table, see docs/DECISIONS.md):
# pseudo-session block sequences from IBL's own generator, decoded by the model under
# test with the same pipeline; per-session median over the pseudo-sessions.
null_pseudosession:
  n_sessions: 100
