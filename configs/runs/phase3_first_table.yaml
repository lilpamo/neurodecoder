# The first six-row table (Phase 3), choices signed off by the user 2026-09-29.
# python -m neurodecoder.cli.evaluate configs/runs/phase3_first_table.yaml
name: phase3_first_table
seed: 0

sessions:
  # NEDS's 10 held-out test sessions (external/NEDS/data/test_eids.txt), minus
  # f140a2ec and d04feec7, which bwm_ephys 1.2.1 doesn't contain.
  fixed:
    - d23a44ef-1402-4ed7-97f5-47e9a7a504d9
    - db4df448-e449-4a6f-a0e7-288711e7a75a
    - 3638d102-e8b6-4230-8742-e548cd87a949
    - 4b7fbad4-f6de-43b4-9b15-c7c7ef44db4b
    - 03d9a098-07bf-4765-88b7-85f8d8f620cc
    - 0841d188-8ef2-4f20-9828-76a94d5343a4
    - 9b528ad0-4599-4a55-9148-96cc1d93fb24
    - 687017d4-c9fc-458f-a7d5-0979fe1a7470
  # Drawn from the rest of the manifest with the seed above.
  random: 2

split:
  train_fraction: 0.8
  gap_s: 2.0
  # Adopted after the first table (docs/DECISIONS.md): block is evaluated
  # leave-one-block-out, every biased block held out once with the same gap.
  leave_one_block_out: [block]

# Evaluated in this order: the fast trial targets first, movement state last.
targets: [choice, block, wheel_velocity, movement_state]

# Per-bin training samples: every k-th bin (evaluation always uses every bin).
train_stride:
  wheel_velocity: 1
  movement_state: 5

# The model row: "ridge" is the per-session ridge / logistic baseline itself.
model: ridge
n_shifts: 20
