# Homepage session catalog (neurodecoder/analysis/catalog.py; docs/DECISIONS.md,
# 2026-09-30).

# A session matches a region only if it has at least this many of the release's good
# units there (the region and its descendants). The page can raise or lower it.
min_region_units: 10

# Trial filters applied when an IBL session is opened from the homepage. bwm_include
# keeps the release's included trials (on d23a44ef: reaction time 0.08-2 s); no-go
# trials are excluded. Phy sessions get only the filters their events CSV supports.
default_trial_filter:
  bwm_include: true
  exclude_nogo: true
