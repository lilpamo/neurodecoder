# Baseline decoders (Phase 3), signed off by the user 2026-09-28. Never change a value
# to improve a test metric (R6). See docs/DECISIONS.md.

# Per-bin targets (wheel velocity, movement state): each unit's counts in n_chunks equal
# chunks of the last context_bins bins: 50 x 20 ms = 1 s, in 200 ms chunks.
per_bin:
  context_bins: 50
  n_chunks: 5

# Trial-level targets (choice, block) use the windows in configs/targets.yaml.
# Ridge/logistic see each unit's count over the whole window.
trial:
  n_chunks: 1

# Regularisation is chosen inside the training data only: n_folds contiguous folds, with
# a max(context, 2 s) gap dropped either side of each validation fold; the lowest mean
# validation MSE (regression) or log loss (classification) wins. Features are
# standardised on the training data, and the penalty is per sample:
#   mean loss + lambda * ||w||²,
# so one lambda means the same for 230 trials or 78k bins. lambda is log-spaced from
# 10^log10_lambda_min to 10^log10_lambda_max. (On d23a44ef's wheel velocity the
# training-only CV optimum is lambda ~ 1.3; the first grid, on sklearn's summed scale,
# stopped short of it.)
cv:
  n_folds: 5
  log10_lambda_min: -4
  log10_lambda_max: 4
  n_lambdas: 17

# model_with_task (adopted after the first table, see docs/DECISIONS.md): the model's
# spike features plus the null_trialstruct features, with the task block's penalty a
# multiple (ratio) of the spike block's. The ratio is chosen with lambda by the same
# CV, from 10^log10_ratio_min to 10^log10_ratio_max.
with_task:
  log10_ratio_min: -2
  log10_ratio_max: 2
  n_ratios: 5

# Sessions fitted in parallel by the per-session baselines (joblib processes).
n_jobs: 6
