<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neurodecoder Studio</title>
<link rel="stylesheet" href="/static/app.css">
<script type="importmap">
  { "imports": { "three": "/static/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">Neurodecoder <span>Studio</span></div>
  <div class="source" id="source">loading…</div>
  <div class="spacer"></div>
  <div class="project">
    <span class="note" id="projectStatus"></span>
    <button class="btn" id="save" title="Save the data source, file hashes and these settings (no results)">Save project</button>
    <button class="btn" id="export" title="Write SVG and PDF figures with their numbers to runs/">Export figures</button>
  </div>
  <div class="seg" id="theme" role="group" aria-label="Theme">
    <button data-v="auto" aria-pressed="true">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
  </div>
</header>
<div class="banner" id="warnings" role="alert" hidden></div>

<div class="shell">
  <aside class="rail">
    <section>
      <h2>Units</h2>
      <label class="check"><input type="checkbox" id="all"> Include units failing QC</label>
      <p class="note" id="counts"></p>
    </section>
    <section>
      <h2>Responsiveness</h2>
      <p class="note" id="testWindows"></p>
      <button class="btn" id="runTest">Test shown units</button>
      <p class="note" id="testSummary"></p>
      <label class="check"><input type="checkbox" id="responsive" disabled> Responsive only</label>
    </section>
    <section>
      <h2>Region level</h2>
      <div class="seg" id="level" role="group" aria-label="Region level"></div>
      <p class="note" id="levelNote"></p>
    </section>
    <section class="grow">
      <h2>Regions</h2>
      <div class="tree" id="tree"></div>
    </section>
  </aside>

  <main>
    <div class="toolbar">
      <label>Event <select id="event"></select></label>
      <label>Window <input type="number" id="t0" value="-0.5" step="0.1"> to <input type="number" id="t1" value="1.0" step="0.1"> s</label>
      <label>Bin <input type="number" id="bin" value="0.02" step="0.005" min="0.001"> s</label>
      <label class="check"><input type="checkbox" id="baseline"> Subtract baseline</label>
      <label>from <input type="number" id="b0" value="-0.5" step="0.1"> to <input type="number" id="b1" value="0" step="0.1"> s</label>
    </div>

    <div class="grid">
      <section class="card area-table">
        <header><h3>Units</h3><span class="meta" id="tableMeta"></span></header>
        <div class="table"><table>
          <thead><tr><th>Unit</th><th>Region</th><th class="num">Depth µm</th><th class="num">Rate Hz</th><th>Label</th><th>QC</th><th title="Responsive to this event (q &lt; alpha)">Resp.</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </section>

      <section class="card area-unit">
        <header><h3>Selected unit</h3></header>
        <p class="caption" id="unitCaption"></p>
        <img id="unitImg" alt="Raster and PSTH of the selected unit">
        <p class="err" id="unitErr"></p>
      </section>

      <section class="card area-pop">
        <header><h3>Population</h3></header>
        <p class="caption" id="popCaption"></p>
        <div class="popwrap"><img id="popImg" alt="Population heatmap"><div class="tip" id="popTip" hidden></div></div>
        <p class="err" id="popErr"></p>
      </section>

      <section class="card area-brain">
        <header><h3>Brain</h3><span class="meta" id="brainMeta"></span></header>
        <div class="brainrow">
          <div class="brain" id="brain"><p class="note" id="brainNote"></p></div>
          <div class="probe"><svg id="probe" role="img" aria-label="Probe strip"></svg></div>
        </div>
      </section>
    </div>
  </main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
