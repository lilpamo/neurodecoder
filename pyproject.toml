[project]
name = "neurodecoder"
version = "0.1.0"
description = "A reliability layer for cross-animal neural population decoding"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "h5py",
    "pynwb",
    "remfile",
    "numcodecs",
    "ONE-api",
    "ibllib",
    "PyYAML",
    "pytest",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurodecoder*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
